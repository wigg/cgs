  <script>
(function () {
  'use strict';
  var ITER = 600000, STORE = 'svs.key.v1', TRIES = 'svs.tries.v1';
  var stage = document.getElementById('lkStage'), card = document.getElementById('lkCard'),
      form = document.getElementById('lockForm'), pin = document.getElementById('lockPin'),
      msg = document.getElementById('lockMsg'), btn = document.getElementById('lockBtn'),
      keep = document.getElementById('lockKeep'), eye = document.getElementById('lkEye'),
      needle = document.getElementById('lkNeedle'), ticks = document.querySelectorAll('.lk-tick');
  var enc = new TextEncoder(), dec = new TextDecoder();

  // The range on the dial is the one the app last saved on this device (battery % and km set in its settings).
  (function () {
    try {
      var st = JSON.parse(localStorage.getItem('motorsound.settings.v2') || '{}');
      if (!(st.battFull > 0)) return;
      var km = Math.max(0, Math.round(st.battKm)), mi = st.units === 'mph';
      var t = document.getElementById('lkRange'), ic = document.getElementById('lkBIcon');
      document.getElementById('lkBatt').setAttribute('stroke-dasharray', (Math.max(0, Math.min(1, st.battKm / st.battFull)) * 100).toFixed(1) + ' 100');
      t.textContent = mi ? Math.round(km * 0.621371) + ' mi' : km + ' km';
      var w = 0; try { w = t.getComputedTextLength(); } catch (e) { w = 140; }
      var total = 48 + w;
      t.setAttribute('x', (300 - total / 2 + 48).toFixed(1));
      ic.setAttribute('transform', 'translate(' + (300 - total / 2).toFixed(1) + ' 492)');
    } catch (e) { /* no saved battery */ }
  })();

  function fromB64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function say(t, bad) { msg.textContent = t; msg.className = 'lk-msg' + (bad ? ' bad' : ''); }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // The dial follows what you type, and sweeps to the redline when the code is right.
  function dial(frac) {
    needle.style.transform = 'rotate(' + (147 + 243 * frac) + 'deg)';
    var upto = Math.round(frac * 100);
    for (var i = 0; i < ticks.length; i++) ticks[i].classList.toggle('on', i <= upto && frac > 0);
  }
  pin.addEventListener('input', function () { dial(Math.min(pin.value.length, 10) / 10 * 0.8); });
  eye.addEventListener('click', function () {
    var show = pin.type === 'password';
    pin.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Hide code' : 'Show code');
    eye.classList.toggle('on', show);
    pin.focus();
  });

  if (!window.crypto || !crypto.subtle) {
    say('This page needs a secure address (https). Open it from its https address.', true);
    pin.disabled = btn.disabled = true;
    return;
  }

  var raw = fromB64(document.getElementById('vault').textContent.trim());
  var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);

  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (buf) {
      window.__SVS_KEY = key; // the sound packs are encrypted with the same key
      return JSON.parse(dec.decode(buf));
    });
  }

  // The app was decrypted: put it on the page and run its scripts in order.
  function start(p) {
    var dsp = p.scripts.filter(function (s) { return s.n === 'engine-dsp.js'; })[0];
    if (dsp) window.__SVS_DSP_URL = URL.createObjectURL(new Blob([dsp.c], { type: 'text/javascript' }));
    document.body.className = '';
    document.body.innerHTML = p.body;
    p.scripts.forEach(function (s) {
      var el = document.createElement('script');
      el.textContent = s.c;
      document.body.appendChild(el);
    });
  }
  // A short sweep to the redline, then the app.
  function reveal(p) {
    stage.classList.add('go');
    dial(1);
    say('Welcome');
    card.classList.add('open');
    setTimeout(function () { start(p); }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 650);
  }

  // Wrong codes wait longer and longer (a speed bump for someone typing guesses).
  function wait() {
    var n = parseInt(get(TRIES), 10) || 0;
    return n >= 3 ? Math.min(60, Math.pow(2, n - 2)) : 0;
  }
  var timer = 0;
  function lockedOut() {
    var s = wait();
    if (s <= 0) { btn.disabled = false; return false; }
    btn.disabled = true;
    var until = Date.now() + s * 1000;
    clearInterval(timer);
    timer = setInterval(function () {
      var left = Math.ceil((until - Date.now()) / 1000);
      if (left <= 0) { clearInterval(timer); btn.disabled = false; say(''); return; }
      say('Wrong code. Try again in ' + left + ' s.', true);
    }, 250);
    say('Wrong code. Try again in ' + s + ' s.', true);
    return true;
  }

  // Remembered on this device: try the saved key first.
  var saved = get(STORE);
  if (saved) {
    crypto.subtle.importKey('raw', fromB64(saved), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(open).then(start, function () { del(STORE); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = pin.value;
    if (!code || btn.disabled) return;
    btn.disabled = true;
    btn.classList.add('busy');
    say('Unlocking\u2026');
    crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base,
          { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      })
      .then(function (key) {
        return open(key).then(function (p) {
          del(TRIES);
          if (keep.checked) crypto.subtle.exportKey('raw', key).then(function (k) { set(STORE, toB64(new Uint8Array(k))); });
          reveal(p);
        });
      })
      .catch(function () {
        set(TRIES, String((parseInt(get(TRIES), 10) || 0) + 1));
        pin.value = '';
        dial(0);
        btn.classList.remove('busy');
        btn.disabled = false;
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        if (!lockedOut()) say('Wrong code. Try again.', true);
        pin.focus();
      });
  });
  pin.focus();
  lockedOut();
})();
</script>
